# テスト・Lint・型チェックとファームのビルド。
# PR と v* のタグで自動で動く（3 OS）。手動（Actions の画面の Run workflow か
# `gh workflow run ci.yml --ref <ブランチ> -f os=linux`）でも動かせる。os は linux（約 5 分）か all（3 OS・約 10 分）
# （public のリポでは標準の runner が無料なので、2026-10-28 に PR ごとの自動に戻した）。
# v* のタグでは、書き込み用の .bin を付けた下書きのリリースを作る（公開は人が確かめてから）。
# PR では、変わったファイルで回すものを絞る（scripts/ci_scope.py。2026-10-28）:
#   文書だけ → Python のテストを Linux だけ（約 1 分）／Python → 3 OS／ファーム・CI の設定 → ファームのビルドも。
# main の保護で必須にするのは ci-ok だけ（飛ばしたジョブを成功とみなし、失敗・中止を落とす）。
# コマンドは AGENTS.md の Commands と揃える。
name: CI

on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      os:
        description: "linux（約 5 分）か all（Linux・Windows・Mac。約 45 分）"
        type: choice
        options: [linux, all]
        default: linux

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 何が変わったか。PR 以外（タグ・手動）はすべて回す
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      python: ${{ steps.scope.outputs.python }}
      firmware: ${{ steps.scope.outputs.firmware }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # 分からなければ（git diff の失敗）空を渡し、ci_scope.py がすべて回す側に倒す
            files=$(git diff --name-only "$BASE" HEAD || true)
          else
            files=""
          fi
          echo "$files"
          echo "$files" | python3 scripts/ci_scope.py | tee -a "$GITHUB_OUTPUT"

  python:
    needs: changes
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 手動の linux・文書だけの PR は Linux だけ、それ以外（Python の PR・タグ・手動の all）は 3 OS
        os: ${{ fromJSON((inputs.os == 'linux' || needs.changes.outputs.python == 'light') && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        python-version: ["3.13"]
        include:
          # 3.10 は対応の下限（tomli を使う側）
          - os: ubuntu-latest
            python-version: "3.10"
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: 依存関係の同期（uv.lock と食い違えば失敗）
        run: uv sync --locked
      - name: テスト
        run: uv run pytest -q
      - name: Lint
        run: uv run ruff check .
      - name: 型チェック
        run: uv run mypy src

  # 文字コードを指定しない読み書き（Windows の既定 cp1252・cp932 で日本語が壊れる）を自分のコードに入れない。
  # 外のライブラリ（site-packages）の警告は数えない
  encoding:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: 文字コードの指定漏れが無いこと
        run: |
          out=$(uv run python -X warn_default_encoding -m pytest -q -W always::EncodingWarning 2>&1)
          echo "$out" | tail -3
          if echo "$out" | grep -E "/(src|scripts|tests)/[^ ]*\.py:[0-9]+: EncodingWarning"; then
            echo "encoding=\"utf-8\" を指定してください" >&2
            exit 1
          fi

  firmware:
    needs: changes
    if: needs.changes.outputs.firmware == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # Mac（Apple Silicon の runner）でもビルドできる（2026-10-27 の CI で確認）
    strategy:
      fail-fast: false
      matrix:
        # 手動の linux は Linux だけ、それ以外（PR・タグ・手動の all）は 3 OS
        os: ${{ fromJSON(inputs.os == 'linux' && '["ubuntu-latest"]' || '["ubuntu-latest", "windows-latest", "macos-latest"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: PlatformIO・esptool（docs/dependencies.md の版）
        run: |
          uv tool install platformio==6.2.0
          uv tool install esptool==5.3.1
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/*/platformio.ini') }}
      - name: 送信機のビルド
        run: pio run -d firmware/csi-tx
      - name: 受信機のビルド
        run: pio run -d firmware/csi-rx
      - name: 書き込み用の .bin
        if: matrix.os == 'ubuntu-latest'
        run: |
          uv sync --locked
          uv run python scripts/make_dist.py
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: firmware
          path: out/firmware/
          if-no-files-found: error

  # main の保護で必須にする唯一のジョブ。飛ばしたジョブは成功とみなし、失敗・中止があれば落とす
  ci-ok:
    if: always()
    needs: [changes, python, encoding, firmware]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 失敗・中止したジョブが無いこと
        env:
          CHANGES: ${{ needs.changes.result }}
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "changes=$CHANGES results=$RESULTS"
          # changes が飛んだ・落ちたなら、他が飛んだのは判定できなかったため。成功とみなさない
          [ "$CHANGES" = "success" ] || exit 1
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [python, encoding, firmware]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: out/firmware
      - name: 下書きのリリースを作る
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/firmware/* --draft --generate-notes --title "$GITHUB_REF_NAME"
