[project]
name = "m5stack-csi-kit"
version = "0.1.0"
description = "M5Stack Basic 2 台で Wi-Fi CSI を記録するキット（書き込み・モニタ・記録）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyserial>=3.5",
    "tomli>=2.0; python_version < '3.11'",  # メタデータ（TOML）の読み込み。3.11+ は標準の tomllib
    "zstandard>=0.22",  # 記録の圧縮 .csv.zst の読み書き
    "pyarrow>=15",  # 解析用の写し（Parquet）の読み書き
]

[project.scripts]
csikit = "csikit.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/csikit"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
