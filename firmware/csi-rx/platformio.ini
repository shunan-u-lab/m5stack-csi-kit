; CSI 受信機（M5Stack Basic・docs/decisions/0001）
;
; Arduino-ESP32 コア 2.0.17（ESP-IDF v4.4.7）に揃えるため、platform を固定する。
; 相手の MAC と制御の鍵はビルドに埋め込まない。書き込み後に csikit flash がシリアルで NVS に置く
; （PAIRSET・docs/decisions/0002）。どの利用者も同じ .bin を使える

[platformio]
default_envs = m5stack-basic

[env:m5stack-basic]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
; 100 Hz × 約 600 バイト/行 ≒ 60 KB/s。115200 bps（≒ 11.5 KB/s）では足りない
monitor_speed = 921600
upload_speed = 460800
; 共有のライブラリ（CsiAuth: 制御パケットの署名。CsiPair: 組の NVS。CsiLcd: 液晶。CsiBoot: 見張り）
lib_extra_dirs = ../shared
; #if の条件を読んでライブラリを選ぶ
lib_ldf_mode = chain+
; 液晶の表示（firmware/shared/CsiLcd）。M5GFX は版を固定する
lib_deps = m5stack/M5GFX@0.1.17
; ファームウェアの版（日付-git の短いハッシュ。未コミットの変更があれば +）。液晶とシリアルの fw= に出す。
; PlatformIO の Python で動かす（python3 の無い Windows でもビルドできるように）
extra_scripts = pre:../shared/fw_version_pio.py
build_flags =
    -D CSI_M5_LCD=1
    -D CSI_LABEL=\"R1\"
    -D CSI_PEER_LABEL=\"T1\"
    ; SD カードへの保存（docs/decisions/0006）。ボタン A 開始・B 停止・C 印
    -D CSI_SD=1
